server {
    listen 443 ssl;
    server_name isfandior.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/isfandior.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isfandior.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name isfandior.duckdns.org;
    return 301 https://isfandior.duckdns.org$request_uri;
}
