name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: SmsPlatforma/package-lock.json

      - name: Install dependencies
        working-directory: SmsPlatforma
        run: npm ci

      - name: Setup CocoaPods
        working-directory: SmsPlatforma/ios
        run: |
          pod install

      - name: Build iOS Application
        working-directory: SmsPlatforma/ios
        run: |
          xcodebuild -workspace SmsPlatforma.xcworkspace \
            -scheme SmsPlatforma \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .app into .ipa
        run: |
          mkdir -p Payload
          cp -r SmsPlatforma/ios/build/Build/Products/Release-iphoneos/SmsPlatforma.app Payload/
          zip -r SmsPlatforma.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmsPlatforma-iOS-IPA
          path: SmsPlatforma.ipa
